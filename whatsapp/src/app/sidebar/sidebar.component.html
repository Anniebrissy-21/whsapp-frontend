<div class="layout-root">
  <aside class="sidebar">
    <!-- Sidebar Header -->
    <div class="sidebar-header d-flex align-items-center justify-content-between">
      <div class="logo d-flex align-items-center">
        <div class="logo-img">
          <!-- <img [src]="logoUrl" alt="Logo" height="28" /> -->
        </div>
        <span class="logo-text">iMedic</span>
      </div>
      <a class="nav-toggle d-none d-lg-block" id="sidebarToggle" href="javascript:;">
        <i class="ft-toggle-left"></i>
      </a>
    </div>
    <!-- Sidebar Menu -->
    <nav class="sidebar-content mt-4">
      <ul class="navigation">
        <!-- Chat Option -->
        <li class="navigation-item">
          <a [routerLink]="['/chat']" class="d-flex align-items-center">
            <i class="ft-message-square"></i>
            <span class="menu-title ms-2">Chat</span>
            <span *ngIf="unreadCount > 0" class="badge bg-primary ms-auto">{{ unreadCount }}</span>
          </a>
        </li>
        <!-- Add more menu items here -->
      </ul>
    </nav>
  </aside>
  
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
